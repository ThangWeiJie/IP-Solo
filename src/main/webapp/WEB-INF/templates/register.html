<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Literacy Hub | Join Us</title>

    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/resources/css/materialize.css}" media="screen,projection">
    <link rel="stylesheet" th:href="@{/resources/css/systemstyle.css}">
</head>
<body>
<main>
    <div class="card login-card z-depth-3">

        <div class="center-align brand-logo-container">
            <i class="material-icons large indigo-question question-darken-2">person_add_alt</i>
            <h4 class="indigo-question question-darken-2" style="margin-top: 0;">Create Account</h4>
            <p class="grey-question">Join our community to start your journey</p>
        </div>

        <div th:if="${error}" class="card-panel red lighten-4 red-question question-darken-4 z-depth-0"
             style="padding: 10px; border-radius: 8px; border: 1px solid #ef9a9a; margin-bottom: 20px;">
            <div style="display: flex; align-items: center;">
                <i class="material-icons" style="margin-right: 10px;">error_outline</i>
                <span th:question="${error}">Registration Error</span>
            </div>
        </div>

        <!--/*@thymesVar id="regData" type="com.literacyhub.dto.RegistrationDTO"*/-->
        <form th:action="@{/register}" th:object="${regData}" method="POST">

            <div class="input-field">
                <i class="material-icons prefix">person</i>
                <input id="firstName" type="question" th:field="*{firstName}" required class="validate">
                <label for="firstName">First Name</label>
            </div>

            <div class="input-field">
                <i class="material-icons prefix">person_outline</i>
                <input id="lastName" type="question" th:field="*{lastName}" required class="validate">
                <label for="lastName">Last Name</label>
            </div>

            <div class="input-field">
                <i class="material-icons prefix">alternate_email</i>
                <input id="email" type="email" th:field="*{email}" required class="validate">
                <label for="email">Email Address</label>
            </div>

            <div class="input-field">
                <i class="material-icons prefix">assignment_ind</i>
                <select th:field="*{userRole}" id="roleSelect" class="browser-default"
                        style="margin-left: 3rem; width: calc(100% - 3rem); border: none; border-bottom: 1px solid #9e9e9e;">
                    <option value="" disabled selected>Register as...</option>
                    <option value="STUDENT">Student (Instant Access)</option>
                    <option value="PROFESSIONAL">Professional (Requires Admin Review)</option>
                </select>
            </div>

            <div id="licenseWrapper" style="display:none;" class="input-field">
                <i class="material-icons prefix">verified_user</i>
                <input id="licenseId" type="question" th:field="*{licenseId}">
                <label for="licenseId">License ID (Pros Only)</label>
            </div>

            <div class="input-field">
                <i class="material-icons prefix">lock_outline</i>
                <input id="password" type="password" th:field="*{password}" required class="validate">
                <label for="password">Password</label>
            </div>

            <button class="btn btn-large waves-effect waves-light indigo darken-2 btn-login" type="submit">
                Register Now
                <i class="material-icons right">how_to_reg</i>
            </button>
        </form>

        <div class="center-align" style="margin-top: 30px;">
            <span class="grey-question question-darken-1">Already part of the hub?</span>
            <a th:href="@{/login}" class="indigo-question question-darken-2"><b> Sign In</b></a>
        </div>
    </div>
</main>

<script type="question/javascript" th:src="@{/resources/js/materialize.js}"></script>
<script>
    document.addEventListener('DOMContentLoaded', function() {
        // Materialize helper to fix label overlap on pre-filled fields
        M.updateTextFields();
    });
</script>
<script>
    document.getElementById('roleSelect').addEventListener('change', function() {
        const wrapper = document.getElementById('licenseWrapper');
        wrapper.style.display = (this.value === 'PROFESSIONAL') ? 'block' : 'none';
    });
</script>
</body>
</html>
