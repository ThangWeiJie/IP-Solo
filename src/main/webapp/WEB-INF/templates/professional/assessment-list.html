<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title}">Manage Assessments</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/resources/css/materialize.css}">
    <link rel="stylesheet" th:href="@{/resources/css/systemstyle.css}">
</head>
<body>
<div th:replace="~{fragments/profheaderfragment :: navbar('assessments')}"></div>

<main class="container">
    <div class="dashboard-card" style="padding: 30px; margin-top: 30px;">
        <h4 th:text="${title}">Manage Assessments</h4>

        <!-- List of all assessments -->
        <ul class="collection">
            <li class="collection-item" th:each="config : ${assessments}">
                <span th:text="${config.testName}">Assessment Name</span>

                <!-- Button to manage questions for this test type -->
                <a th:href="@{/professional/assessments/{type}(type=${config.testType})}"
                   class="secondary-content btn-small indigo waves-effect waves-light">
                    Manage Questions
                    <i class="material-icons right">arrow_forward</i>
                </a>
            </li>
        </ul>

        <!-- Optional: Add new assessment button -->
        <div style="margin-top: 20px;">
            <a th:href="@{/professional/assessments/new}" class="btn waves-effect waves-light green">
                Add New Assessment
                <i class="material-icons right">add</i>
            </a>
        </div>
    </div>
</main>

<script th:src="@{/resources/js/materialize.js}"></script>
</body>
</html>
