<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title}">Manage Assessment</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/resources/css/materialize.css}">
    <link rel="stylesheet" th:href="@{/resources/css/systemstyle.css}">
</head>
<body>
<header>
    <div th:switch="${userRole}">
        <div th:case="'professional'">
            <div th:replace="~{fragments/profheaderfragment :: navbar('assessments')}"></div>
        </div>

        <div th:case="'admin'">
            <div th:replace="~{fragments/adminheaderfragment :: navbar('assessments')}"></div>
        </div>

        <div th:case="*">
            <p style="color:red; text-align:center;">Warning: No valid role detected! ([[${userRole}]])</p>
        </div>
    </div>
</header>

<main class="container">
    <h4 th:text="'Manage Assessment: ' + ${testType}">Manage Assessment</h4>

    <!-- Shared Options Section -->
    <div class="dashboard-card" style="margin-top: 20px;">
        <h5>Shared Options</h5>
        <table class="highlight">
            <thead>
            <tr>
                <th>Label</th>
                <th>Value</th>
                <th>Order</th>
                <th>Actions</th>
            </tr>
            </thead>
            <tbody>
            <!-- Existing options -->
            <tr th:each="opt : ${options}">
                <td th:text="${opt.optionLabel}">Label</td>
                <td th:text="${opt.optionValue}">Value</td>
                <td th:text="${opt.displayOrder}">Order</td>
                <td>
                    <form th:action="@{/{role}/assessments/option/delete/{id}(role=${userRole}, id=${opt.id})}" method="post">
                        <input type="hidden" name="testType" th:value="${testType}"/>
                        <button type="submit" class="btn-small red">Delete</button>
                    </form>
                </td>
            </tr>

            <!-- Add new option -->
            <tr>
                <form th:action="@{/{role}/assessments/{testType}/options/save(role=${userRole}, testType=${testType})}" method="post">
                    <td><input type="text" name="optionLabel" placeholder="Option Label" required/></td>
                    <td><input type="number" name="optionValue" placeholder="Option Value" required/></td>
                    <td><input type="number" name="displayOrder" placeholder="Order"/></td>
                    <td><button type="submit" class="btn-small green">Add Option</button></td>
                </form>
            </tr>
            </tbody>
        </table>
    </div>

    <!-- Questions Section -->
    <div class="dashboard-card" style="margin-top: 20px;">
        <h5>Questions</h5>
        <table class="highlight">
            <thead>
            <tr>
                <th>#</th>
                <th>Question</th>
                <th>Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="q, iter : ${questions}">
                <td th:text="${iter.count}">1</td>
                <td th:text="${q.question}">Question text</td>
                <td>
                    <a th:href="@{/{role}/assessments/question/edit/{id}(role=${userRole}, id=${q.id})}" class="btn-small blue">Edit</a>

                    <form th:action="@{/{role}/assessments/question/delete/{id}(role=${userRole}, id=${q.id})}" method="post" style="display:inline">
                        <input type="hidden" name="testType" th:value="${testType}"/>
                        <button type="submit" class="btn-small red">Delete</button>
                    </form>
                </td>
            </tr>

            <tr th:style="${newQuestion.id != null ? 'background-color: #e3f2fd;' : ''}">
                <!--/*@thymesVar id="newQuestion" type="com.literacyhub.entity.AssessmentQuestion"*/-->
                <form th:action="@{/{role}/assessments/{testType}/questions/save(role=${userRole}, testType=${testType})}"
                      method="post"
                      th:object="${newQuestion}">

                    <input type="hidden" th:field="*{id}" />
                    <input type="hidden" th:field="*{category}" />

                    <td>
                        <span th:if="${newQuestion.id != null}" class="blue-text"><b>EDIT</b></span>
                        <span th:if="${newQuestion.id == null}">#</span>
                    </td>
                    <td>
                        <input type="text" th:field="*{question}" placeholder="New question" required/>
                    </td>
                    <td>
                        <button type="submit" class="btn-small"
                                th:classappend="${newQuestion.id != null} ? 'orange' : 'green'"
                                th:text="${newQuestion.id != null} ? 'Update' : 'Add Question'">
                            Action
                        </button>

                        <a th:if="${newQuestion.id != null}"
                           th:href="@{/{role}/assessments/{testType}(role=${userRole}, testType=${testType})}"
                           class="btn-small grey">Cancel</a>
                    </td>
                </form>
            </tr>
            </tbody>
        </table>
    </div>

</main>

<script th:src="@{/resources/js/materialize.js}"></script>
<script th:inline="javascript">
    /*<![CDATA[*/
    var msg = /*[[${message}]]*/ null;
    if (msg) {
        M.toast({
            html: msg,
            displayLength: 4000,
            classes: 'rounded green'
        });
    }
    /*]]>*/
</script>
</body>
</html>
