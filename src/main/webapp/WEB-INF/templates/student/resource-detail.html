<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Resource Detail</title>
    <link rel="stylesheet" th:href="@{/resources/css/materialize.css}"/>
    <link rel="stylesheet" th:href="@{/resources/css/systemstyle.css}"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <style>
        body { background-color: #f5f5f5; }
        .container { max-width: 900px; margin: 24px auto; padding: 0 16px; }
        .card { background: white; border-radius: 12px; padding: 24px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .title { display: flex; align-items: center; gap: 8px; margin: 0 0 8px 0; }
        .title h4 { margin: 0; font-weight: 400; }
        .category { display: inline-block; background: #e8eaf6; color: #3949ab; padding: 4px 12px; border-radius: 20px; font-size: 0.85rem; font-weight: 600; }
        .desc { color: #555; line-height: 1.6; white-space: pre-line; }
        .actions { display: flex; gap: 12px; margin-top: 20px; }
        .actions .btn { text-transform: none !important; }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <div class="title">
            <i class="material-icons">description</i>
            <h4 th:text="${resource.title}">Resource Title</h4>
        </div>
        <div class="category" th:text="${resource.category}">Category</div>
        
        <!-- YouTube Video Embed Section -->
        <div id="youtubeContainer" style="margin: 20px 0;"></div>
        
        <p class="desc" id="resourceDescription" th:text="${resource.description}">Full description...</p>
        <div class="actions">
            <a class="btn indigo darken-1" th:href="@{'/resource/download/' + ${resource.resourceId}}" target="_blank">
                <i class="material-icons left">open_in_new</i>Open in New Tab
            </a>
            <a class="btn grey" th:href="@{/student/resources}">
                <i class="material-icons left">arrow_back</i>Back to List
            </a>
        </div>
    </div>
</div>
<script type="text/javascript" th:src="@{/resources/js/materialize.js}"></script>
<script>
    document.addEventListener('DOMContentLoaded', function() {
        M.AutoInit();
        
        // YouTube video embedding
        const descriptionText = document.getElementById('resourceDescription').textContent;
        const youtubeContainer = document.getElementById('youtubeContainer');
        
        // Extract YouTube video IDs from description
        const youtubeRegex = /(?:https?:\/\/)?(?:www\.)?(?:youtube\.com\/watch\?v=|youtu\.be\/)([a-zA-Z0-9_-]{11})/g;
        const matches = [...descriptionText.matchAll(youtubeRegex)];
        
        if (matches.length > 0) {
            matches.forEach((match, index) => {
                const videoId = match[1];
                const embedDiv = document.createElement('div');
                embedDiv.style.cssText = 'position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; max-width: 100%; margin-bottom: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.15);';
                
                const iframe = document.createElement('iframe');
                iframe.src = `https://www.youtube.com/embed/${videoId}`;
                iframe.style.cssText = 'position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0;';
                iframe.setAttribute('allowfullscreen', '');
                iframe.setAttribute('allow', 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture');
                
                embedDiv.appendChild(iframe);
                youtubeContainer.appendChild(embedDiv);
            });
        }
    });
</script>
</body>
</html>
