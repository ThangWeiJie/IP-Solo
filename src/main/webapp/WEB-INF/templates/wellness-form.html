<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${title}">Wellness Tip Form</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/resources/css/materialize.css}">
    <link rel="stylesheet" th:href="@{/resources/css/systemstyle.css}">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>

<header>
    <div th:switch="${userRole}">
        <div th:case="'professional'">
            <div th:replace="~{fragments/profheaderfragment :: navbar('wellness')}"></div>
        </div>

        <div th:case="'admin'">
            <div th:replace="~{fragments/adminheaderfragment :: navbar('wellness')}"></div>
        </div>

        <div th:case="*">
            <p style="color:red; text-align:center;">Warning: No valid role detected! ([[${userRole}]])</p>
        </div>
    </div>
</header>

<main class="management-main">
    <div class="dashboard-container">

        <div class="dashboard-card">
            <h4 class="section-header">
                <i class="material-icons">edit</i>
                <span th:text="${title}">Add/Edit Wellness Tip</span>
            </h4>

            <form th:action="@{/{role}/wellness/{action}(role=${userRole}, action=${tip.id != null ? 'update' : 'save'})}"
                  th:object="${tip}" method="post">

                <input type="hidden" th:field="*{id}" />

                <div class="input-field">
                    <textarea th:field="*{tip}" id="tip" class="materialize-textarea" required></textarea>
                    <label for="tip">Tip Text</label>
                </div>

                <div class="center-align" style="margin-top: 20px;">
                    <button type="submit" class="btn indigo">
                        <i class="material-icons left">save</i>
                        Save
                    </button>
                    <a th:href="@{/{role}/wellness/list(role=${userRole})}" class="btn grey">
                        Cancel
                    </a>
                </div>

            </form>
        </div>

    </div>
</main>

<script type="text/javascript" th:src="@{/resources/js/materialize.js}"></script>
<script>
    document.addEventListener('DOMContentLoaded', function () {
        M.updateTextFields();
        // Auto-resize textarea if there is existing content (for Edit mode)
        M.textareaAutoResize(document.querySelector('#tip'));
    });
</script>
</body>
</html>
